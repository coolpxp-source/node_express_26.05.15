<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <title>Document</title>
</head>
<body>
    <div id="app">
        <div>
            <label>아이디 : <input type="text" v-model="info.userId"></label>
        </div>
        <div>
            <label>비밀번호 : <input type="password" v-model="info.pwd"></label>
        </div>
        <div>
            <button @click="fnLogin()">로그인</button>
        </div>
    </div>
</body>
</html>
<script>
    const app = Vue.createApp({
        data() {
            return {
                // 변수 - (key : value)
                info : {
                    userId : "",
                    pwd : ""
                }
            }
        },
        methods: {
            // 함수(메소드) - (key : function())
            fnLogin: function() {
                let self = this;
                fetch("http://localhost:3000/user/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(self.info)
                })
                    .then(res => res.json())
                    .then(data => {
                        console.log(data);
                        if (data.result === "success") {
                            alert(data.info.userName +"님 로그인 성공!");
                            <!-- location.href = "#"; -->
                        } else {
                            alert("아이디 또는 비밀번호가 틀렸습니다.");
                        }
                    })
            },
        }, // methods
        mounted() {
            // 처음 시작할 때 실행되는 부분
        
        }
    });

    app.mount('#app');
</script>
