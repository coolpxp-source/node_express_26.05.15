<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        table, tr, td, th{
            border : 1px solid black;
            border-collapse: collapse;
            padding : 5px 10px;
            text-align: center;
        }
        th{
            background-color: beige;
        }
        tr:nth-child(even){
            background-color: azure;
        }
        .button{
            margin-top: 5px;
            margin-right: 5pt;
            background-color: azure;
            padding: 5px;
            border-radius: 10px;
            cursor: pointer;
        }
        .button:hover{
            box-shadow: 1px 1px 1px gray;
            background-color: aquamarine;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- html 코드는 id가 app인 태그 안에서 작업 -->
        <div>
            <table>
                <tr><td>번호</td><td>{{info.BOARDNO}}</td></tr>
                <tr><td>작성자</td><td>{{info.USERID}}</td></tr>
                <tr><td>제목</td><td>{{info.TITLE}}</td></tr>
                <tr><td>내용</td><td>{{info.CONTENTS}}</td></tr>
                <tr><td>조회수</td><td>{{info.CNT}}</td></tr>
                <tr><td>작성일</td><td>{{info.CDATE}}</td></tr>
            </table>
        </div>
        <span>
            <button class="button" @click="fnBack()">목록으로</button>
        </span>
        <span>
            <button class="button" @click="fnRemove(info.BOARDNO)">삭제</button>
        </span>
        <span>
            <button class="button" @click="fnEdit(info.BOARDNO)">수정</button>
        </span>
    </div>
</body>
</html>

<script>
    const app = Vue.createApp({
        data() {
            return {
                // 변수 - (key : value)
                boardNo : "",
                info : {}
            };
        },
        methods: {
            // 함수(메소드) - (key : function())
            fnView: function () {
                let self = this;
                fetch(`http://localhost:3000/board/${self.boardNo}`)
                    .then(res => res.json())
                    .then(data => {
                        self.info = data.info;
                    })
            },
            fnBack: function() {
                location.href = "board-list.html";
            },
            fnRemove : function() {
                let self = this;
                fetch(`http://localhost:3000/board/${self.boardNo}`,{
                     method : "DELETE" // default로 GET
                })
                    .then(res => res.json())
                    .then(data => {
                        alert("삭제 됨!");
                        location.href = "board-list.html";
                    })
            },
            fnEdit : function(){
                location.href = "board-edit.html?boardNo=" + this.boardNo; 
            }
        }, // methods
        mounted() {
            // 처음 시작할 때 실행되는 부분
            let self = this;
            const queryParams = new URLSearchParams(window.location.search);
            self.boardNo = queryParams.get('boardNo') || "";
            this.fnView(); // ← 추가!
        }
    });

    app.mount('#app');
</script>
